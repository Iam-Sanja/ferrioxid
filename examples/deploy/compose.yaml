# Minimal deployment contract.
# PostgreSQL is only on the internal network. The public origin is the proxy name,
# not the container bind address and not a forwarded host header.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fexu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD outside the compose file}
      POSTGRES_DB: fexu
    volumes:
      - fexu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fexu -d fexu"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: examples/deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://fexu:${POSTGRES_PASSWORD}@postgres:5432/fexu
      BIND_ADDRESS: 0.0.0.0:3000
      FEXU_ALLOW_WILDCARD_BIND: "true"
      FEXU_ALLOWED_ORIGINS: https://shop.example
      FEXU_TRUST_PROXY: "true"
      # Set this to the proxy container's address on this network. A name or * is not trusted.
      FEXU_TRUSTED_PROXIES: ${FEXU_TRUSTED_PROXIES:-}
      FEXU_COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  proxy:
    image: caddy:2
    ports:
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app

volumes:
  fexu-postgres:
