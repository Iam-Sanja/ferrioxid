{% extends "base.html" %}
{% block content %}
<nav class="crumbs" aria-label="{{ i18n.breadcrumb }}"><a href="/admin">{{ i18n.dashboard }}</a> / <span>{{ title }}</span></nav>
<p>{{ intro }}</p>
{% if rows %}
<ul class="cards">
{% for row in rows %}
<li class="card"><h2>{{ row.label }}</h2><p>{{ row.value }}</p></li>
{% endfor %}
</ul>
{% else %}
<p class="empty">{{ empty }}</p>
{% endif %}
<form method="post" action="/admin/pages/orders">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<button type="submit">{{ refresh }}</button>
</form>
{% endblock %}
