{% extends "base.html" %}
{% block content %}
<p>{{ i18n.welcome }}{% if user_email %}, {{ user_email }}{% endif %}.</p>
{% if models | length == 0 %}
<p class="empty">{{ i18n.no_models }}</p>
{% else %}
<ul class="cards">
{% for model in models %}
<li class="card"><h2>{{ model.label }}</h2><a href="/admin/models/{{ model.key }}">{{ i18n.open }}</a></li>
{% endfor %}
</ul>
{% endif %}
{% endblock %}
