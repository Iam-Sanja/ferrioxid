{% extends "base.html" %}
{% block content %}
<form class="card narrow" method="post" action="/admin/login">
<input type="hidden" name="csrf_token" value="{{ login_csrf }}">
<input type="hidden" name="next" value="{{ next }}">
<div class="field">
<label for="email">{{ i18n.email }} <span aria-hidden="true">*</span> <span class="hint">{{ i18n.required }}</span></label>
<input id="email" name="email" type="email" autocomplete="username" required value="{{ email }}">
</div>
<div class="field">
<label for="password">{{ i18n.password }} <span aria-hidden="true">*</span> <span class="hint">{{ i18n.required }}</span></label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<div class="actions">
<button type="submit">{{ i18n.login }}</button>
</div>
</form>
{% endblock %}
