services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fexu_test_deploy
      POSTGRES_USER: fexu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fexu_dev_only}
    volumes:
      - fexu_deploy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fexu -d fexu_test_deploy"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://fexu:${POSTGRES_PASSWORD:-fexu_dev_only}@db:5432/fexu_test_deploy
      BIND_ADDRESS: 0.0.0.0:8080
      FEXU_ENV: production
      FEXU_COOKIE_SECURE: "1"
      FEXU_CSRF_SECRET: ${FEXU_CSRF_SECRET:?set 64 hex characters}
      FEXU_ALLOWED_ORIGINS: https://localhost:8443
      FEXU_LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  fexu_deploy_pg:
