name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # Cargo.lock includes SQLx's optional MySQL driver and its RSA crate even
      # when Fexu enables only PostgreSQL/SQLite. Do not accept the exemption
      # if RSA becomes reachable in any workspace build (all OS targets).
      - name: Verify RSA is absent from the enabled dependency graph
        shell: bash
        run: |
          cargo tree --workspace --target all --prefix none --locked > "$RUNNER_TEMP/fexu-dependencies.txt"
          if grep -E '^rsa v[0-9]' "$RUNNER_TEMP/fexu-dependencies.txt"; then
            echo "::error::RSA is enabled in the workspace dependency graph; reassess RUSTSEC-2023-0071 before allowing this build."
            exit 1
          fi

      - name: Audit Cargo.lock (unfiltered report)
        continue-on-error: true
        run: cargo audit

      # RUSTSEC-2023-0071 is a lockfile-only match through the optional
      # sqlx-mysql driver, not enabled by Fexu. Gate other advisories as
      # errors. Review/remove this exception if features or SQLx change.
      # Tracking issue: https://github.com/Iam-Sanja/ferrioxid/issues/8
      - name: Audit all other vulnerabilities
        run: cargo audit --ignore RUSTSEC-2023-0071
