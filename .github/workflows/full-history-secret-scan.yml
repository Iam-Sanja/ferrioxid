name: Full Git history secret scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/full-history-secret-scan.yml

permissions:
  contents: read

concurrency:
  group: history-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include available GitHub pull request heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin '+refs/pull/*/head:refs/remotes/pr-head/*'
          echo "Reachable commits: $(git rev-list --all --count)"
          echo "PR head refs: $(git for-each-ref --format='%(refname)' refs/remotes/pr-head | wc -l)"

      - name: Install pinned Gitleaks version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan-bin"
          GOBIN="$RUNNER_TEMP/scan-bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$RUNNER_TEMP/scan-bin/gitleaks" version

      - name: Scan every fetched Git ref without publishing secret material
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/history-secret-findings.json"
          output="$RUNNER_TEMP/history-secret-output.log"
          set +e
          "$RUNNER_TEMP/scan-bin/gitleaks" git \
            --log-opts="--all --full-history" \
            --redact=100 \
            --report-format=json \
            --report-path="$report" . >"$output" 2>&1
          result=$?
          set -e
          python3 - "$report" "$result" <<'PY'
          import collections
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          result = int(sys.argv[2])
          if result not in (0, 1) or not report.exists():
              print(f"Scanner did not produce a valid completed scan (exit {result}).")
              sys.exit(2)
          records = json.loads(report.read_text(encoding="utf-8") or "[]")
          if not isinstance(records, list):
              print("Unexpected Gitleaks report format.")
              sys.exit(2)
          # Exact historical locations reviewed on 2026-11-08.
          # The corresponding lines are a public password-reset example and
          # a deliberately incorrect password in a local login regression test.
          # No path-wide, rule-wide or future-commit exclusions are permitted.
          reviewed_fixtures = {
              ("generic-api-key", "docs/password-reset.md",
               "2fe6ac20b36870c6b8a42b06c5b5c0cdf7ee3699", 45),
              ("generic-api-key", "examples/myshop/tests/admin_html.rs",
               "bbc1a8f91792eae6cb2e53765c9e1ea53ae35644", 247),
          }
          known = []
          unexpected = []
          for row in records:
              identity = (row.get("RuleID"), row.get("File"),
                          row.get("Commit"), row.get("StartLine"))
              (known if identity in reviewed_fixtures else unexpected).append(row)
          print(f"Total findings: {len(records)}")
          print(f"Previously reviewed historical test/example fixtures: {len(known)}")
          print(f"New or unreviewed findings: {len(unexpected)}")
          for rule, count in sorted(collections.Counter(
              row.get("RuleID", "unknown") for row in unexpected
          ).items()):
              print(f"Unreviewed rule {rule}: {count}")
          for row in unexpected:
              filename = str(row.get("File", "unknown")).replace("\\n", " ").replace("\\r", " ")
              commit = str(row.get("Commit", "unknown"))[:12]
              print(f"Unreviewed location: {filename} | {commit} | line {row.get('StartLine', '?')}")
          print("No matched secret values, source lines, or raw reports were uploaded.")
          if unexpected or (result == 1 and not records):
              sys.exit(1)
          PY
