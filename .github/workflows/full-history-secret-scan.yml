name: Full Git history secret scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/full-history-secret-scan.yml

permissions:
  contents: read

concurrency:
  group: history-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-history:
    name: Gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include available GitHub pull request heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin '+refs/pull/*/head:refs/remotes/pr-head/*'
          echo "Reachable commits: $(git rev-list --all --count)"
          echo "PR head refs: $(git for-each-ref --format='%(refname)' refs/remotes/pr-head | wc -l)"

      - name: Install pinned Gitleaks version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scan-bin"
          GOBIN="$RUNNER_TEMP/scan-bin" go install github.com/gitleaks/gitleaks/v8@v8.30.1
          "$RUNNER_TEMP/scan-bin/gitleaks" version

      - name: Scan every fetched Git ref without publishing secret material
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/history-secret-findings.json"
          output="$RUNNER_TEMP/history-secret-output.log"
          set +e
          "$RUNNER_TEMP/scan-bin/gitleaks" git \
            --log-opts="--all --full-history" \
            --redact=100 \
            --report-format=json \
            --report-path="$report" . >"$output" 2>&1
          result=$?
          set -e
          python3 - "$report" "$result" <<'PY'
          import collections
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          result = int(sys.argv[2])
          if report.exists():
              records = json.loads(report.read_text(encoding="utf-8") or "[]")
              by_rule = collections.Counter(row.get("RuleID", "unknown") for row in records)
              print(f"Findings: {len(records)}")
              for rule, count in sorted(by_rule.items()):
                  print(f"Rule {rule}: {count}")
          else:
              print("Gitleaks produced no JSON report.")
          print(f"Gitleaks exit status: {result}")
          print("Unredacted findings, raw scan logs, and reports were not uploaded.")
          PY
          if [ "$result" -ne 0 ]; then
            echo "::error::History scan did not pass. Review findings privately with a local Gitleaks run."
            exit "$result"
          fi
