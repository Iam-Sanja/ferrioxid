# Second pass: retain code-heavy lines for manual review.
name: One-time offline documentation translation

on:
  push:
    branches:
      - docs/english-documentation
    paths:
      - .github/workflows/translate-docs-once.yml

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install offline translation engine
        run: |
          python -m pip install --disable-pip-version-check argostranslate langdetect
          python - <<'PY'
          import argostranslate.package
          argostranslate.package.update_package_index()
          models = [p for p in argostranslate.package.get_available_packages() if p.from_code == 'de' and p.to_code == 'en']
          if not models:
              raise RuntimeError('No Argos de-en model found')
          argostranslate.package.install_from_path(models[0].download())
          print('Offline German-English translation model installed')
          PY

      - name: Translate Markdown without external text services
        run: python .github/scripts/translate_docs_offline.py

      - name: Verify and commit translated documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs README.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "docs: translate German developer documentation to English"
          git push origin HEAD:refs/heads/docs/english-documentation
