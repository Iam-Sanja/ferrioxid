name: One-time Rustfmt for translated CLI and migration engine
on:
  push:
    branches: [feat/english-cli]
    paths:
      - .github/workflows/format-cli-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/ferrioxid-cli crates/ferrioxid-migrations
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "style(cli): apply rustfmt to English source and migration messages"
            git push origin HEAD:refs/heads/feat/english-cli
          fi
