name: One-time CLI rustfmt

on:
  push:
    branches:
      - feat/english-cli
    paths:
      - .github/workflows/format-cli-once.yml

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt
      - name: Format workspace source
        run: cargo fmt --all
      - name: Commit CLI formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/ferrioxid-cli
          git diff --cached --check
          git commit -m "style(cli): apply rustfmt after English translations"
          git push origin HEAD:refs/heads/feat/english-cli
