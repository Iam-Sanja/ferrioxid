[workspace]
resolver = "2"
members = [
  "crates/ferrioxid", "crates/ferrioxid-core", "crates/ferrioxid-macros",
  "crates/ferrioxid-db", "crates/ferrioxid-api", "crates/ferrioxid-cli",
  "crates/ferrioxid-migrations", "crates/ferrioxid-auth", "crates/ferrioxid-admin",
  "crates/ferrioxid-forms", "crates/ferrioxid-static", "crates/ferrioxid-storage",
  "crates/ferrioxid-middleware", "crates/ferrioxid-mail", "crates/ferrioxid-jobs",
  "examples/myshop",
  "examples/notes"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls", "with-uuid", "with-json", "with-chrono"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
tera = "1"
sha2 = "0.10"
argon2 = "0.5"
rpassword = "7"
