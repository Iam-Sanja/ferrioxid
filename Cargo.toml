[workspace]
resolver = "2"
members = [
  "crates/fexu", "crates/fexu-core", "crates/fexu-macros",
  "crates/fexu-db", "crates/fexu-api", "crates/fexu-cli",
  "crates/fexu-migrations", "crates/fexu-auth", "crates/fexu-cache", "crates/fexu-admin",
  "crates/fexu-forms", "crates/fexu-static", "crates/fexu-storage",
  "crates/fexu-middleware", "crates/fexu-mail", "crates/fexu-jobs",
  "examples/myshop",
  "examples/notes",
  "examples/desk"
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
description = "Experimental model-first web framework"
repository = "https://github.com/Iam-Sanja/fexu-rs"
homepage = "https://github.com/Iam-Sanja/fexu-rs"
keywords = ["web", "framework", "orm", "admin"]
categories = ["web-programming"]
readme = "README.md"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
sea-query = { version = "=0.32.7", default-features = false, features = ["thread-safe", "backend-postgres", "backend-sqlite", "with-json", "with-chrono", "with-uuid", "with-rust_decimal"] }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json", "chrono", "uuid", "rust_decimal"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["json", "chrono", "uuid", "rust_decimal"] }
rusqlite = { version = "=0.42.0", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
tera = "1"
sha2 = "0.10"
argon2 = "0.5"
rpassword = "7"

# Path keeps workspace builds. The version is what cargo package writes into a published manifest.
fexu = { path = "crates/fexu", version = "0.1.0" }
fexu-admin = { path = "crates/fexu-admin", version = "0.1.0" }
fexu-api = { path = "crates/fexu-api", version = "0.1.0" }
fexu-auth = { path = "crates/fexu-auth", version = "0.1.0" }
fexu-cache = { path = "crates/fexu-cache", version = "0.1.0" }
fexu-cli = { path = "crates/fexu-cli", version = "0.1.0" }
fexu-core = { path = "crates/fexu-core", version = "0.1.0" }
fexu-db = { path = "crates/fexu-db", version = "0.1.0" }
fexu-forms = { path = "crates/fexu-forms", version = "0.1.0" }
fexu-jobs = { path = "crates/fexu-jobs", version = "0.1.0" }
fexu-macros = { path = "crates/fexu-macros", version = "0.1.0" }
fexu-mail = { path = "crates/fexu-mail", version = "0.1.0" }
fexu-middleware = { path = "crates/fexu-middleware", version = "0.1.0" }
fexu-migrations = { path = "crates/fexu-migrations", version = "0.1.0" }
fexu-static = { path = "crates/fexu-static", version = "0.1.0" }
fexu-storage = { path = "crates/fexu-storage", version = "0.1.0" }
