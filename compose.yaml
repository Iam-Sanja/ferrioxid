services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fexu
      POSTGRES_USER: fexu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fexu_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fexu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fexu -d fexu"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fexu_pgdata:
